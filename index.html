<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ashley's Automatic Scrubber – Learn &amp; Quiz</title>
<style>
:root{--sky:#8fc4f0;--sky-deep:#3f8fd6;--ink:#1d2b3a;--paper:#fffdf5;--qyellow:#ffcf2e;--qyellow-deep:#e0a800;--brick:#e5483d;--good:#2fa862;--good-bg:#d9f6e4;--bad-bg:#ffe9d6;--grey:#5b6773;--line:#c9dff3;--lav:#e7ddff;
--display:'Fredoka','Trebuchet MS',system-ui,sans-serif;--body:'Andika','Comic Sans MS','Segoe UI',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:20px;padding:20px 16px;min-height:100vh;
background-image:radial-gradient(circle at 20px 20px,#ffffff44 3px,transparent 4px);background-size:56px 56px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--brick);outline-offset:3px}
h1,h2,.btn,.chip{font-family:var(--display)}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;background:var(--qyellow);padding:6px 14px;border-radius:12px;box-shadow:0 4px 0 var(--qyellow-deep)}
.stars{font-family:var(--display);font-weight:600;background:var(--paper);padding:6px 14px;border-radius:12px;white-space:nowrap}
.card{background:var(--paper);border-radius:28px;padding:22px;box-shadow:0 8px 0 var(--sky-deep);display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero svg{width:110px;flex:none}
.hero h1{margin:0;font-size:2rem;line-height:1.05;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--grey)}
.topics{display:grid;gap:12px}
.topic{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:20px;border:3px solid var(--line);background:#fff;transition:transform .12s}
.topic:hover{transform:translateY(-2px);border-color:var(--sky-deep)}
.topic .big{font-size:2.4rem;width:58px;text-align:center;flex:none}
.topic b{font-family:var(--display);font-size:1.3rem;display:block}
.topic .sub{color:var(--grey);font-size:.85rem}
.topic .best{margin-left:auto;white-space:nowrap}
.topic.mix{background:var(--qyellow);border-color:var(--qyellow-deep)}
.topic.mix .sub{color:#5b4600}
.meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);color:var(--grey);gap:8px}
.chip{background:#fff;border:2px solid var(--line);padding:4px 12px;border-radius:99px;font-size:.9rem}
.link{font-family:var(--display);color:var(--grey);text-decoration:underline;font-size:1rem}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.qrow{display:flex;gap:14px;align-items:center}
.qrow svg{width:84px;flex:none}
.q{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1.2;margin:0;text-wrap:balance;min-width:0}
.speak{flex:none;width:54px;height:54px;border-radius:50%;background:var(--sky);font-size:1.5rem;box-shadow:0 4px 0 var(--sky-deep)}
.speak:active{transform:translateY(3px);box-shadow:none}
.lives{font-size:1.7rem;text-align:center;letter-spacing:6px;min-height:2.2rem}
.lives .lost{filter:grayscale(1);opacity:.35;animation:pop .4s}
@keyframes pop{30%{transform:scale(1.5)}}
.visual{font-size:4.2rem;text-align:center;line-height:1.1;background:#eaf5ff;border-radius:20px;padding:12px}
.visual.photo{background:#fff;border:3px solid var(--line);padding:8px}
.visual img{display:block;margin:0 auto;max-height:230px;max-width:100%;width:auto;border-radius:14px;object-fit:contain}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:76px;border-radius:20px;border:4px solid var(--line);background:#fff;text-align:left;font-family:var(--display);font-weight:600;font-size:1.3rem;transition:transform .1s}
.opt:hover:not([disabled]){transform:translateY(-2px);border-color:var(--sky-deep)}
.opt .em{flex:none;width:96px;height:80px;display:block}
.opt .em img{display:block;width:100%;height:100%;object-fit:contain;border-radius:8px}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:#f0a15c;opacity:.6}
.opt[disabled]{cursor:default}
.fb{min-height:3.2em;font-family:var(--display);font-size:1.15rem;font-weight:600;display:flex;align-items:center;border-radius:16px;padding:8px 14px}
.fb.good{background:var(--good-bg);color:#126b38}
.fb.bad{background:var(--bad-bg);color:#8a4a12}
.fb .why{font-family:var(--body);font-weight:400;font-size:.95rem;color:var(--ink)}
.btn{background:var(--brick);color:#fff;font-weight:700;font-size:1.4rem;padding:14px 26px;border-radius:18px;box-shadow:0 6px 0 #a8281f;align-self:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a8281f}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line);border:3px solid var(--line)}
.btn[hidden]{display:none}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.result{text-align:center;align-items:center}
.result h2{margin:0;font-size:2rem}
.result svg{width:150px}
.big-stars{font-size:3rem;letter-spacing:6px}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* flashcards */
.stage{perspective:1200px;height:min(70vh,520px);min-height:380px;cursor:pointer}
.fcard{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--ink);border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow:auto;box-shadow:0 5px 0 var(--ink)}
.face.front{background:var(--lav)}
.face.back{background:#fff2a8;transform:rotateY(180deg)}
.face .q{font-size:clamp(22px,4.6vw,30px)}
.face .ans{font-family:var(--display);font-size:clamp(28px,6.5vw,42px);font-weight:700;margin:0;line-height:1.15}
.face .note{margin:0;font-size:clamp(17px,3.8vw,21px)}
.face .hint{margin:0;font-size:15px;opacity:.7}
.face img{max-width:100%;max-height:42%;border:3px solid var(--ink);border-radius:16px;background:#fff;object-fit:contain}
.face.back img{max-height:32%}
.fnav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fnav button{border:3px solid var(--ink);border-radius:18px;background:#ffd9ec;padding:10px 18px;font-family:var(--display);font-size:1.1rem;font-weight:600;box-shadow:0 4px 0 var(--ink)}
.fnav button.mid{background:#d6f5e2}
.fnav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* full-screen feedback */
#conf{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#wrongfx{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;
background:radial-gradient(circle at 50% 35%,#ffd2a1,#ff9f68);color:#4a2306;cursor:pointer}
#wrongfx.show{display:flex;animation:wfade .25s}
@keyframes wfade{from{opacity:0}}
#wrongfx svg{width:min(170px,40vw);animation:wob .6s}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
#wrongfx h2{font-size:clamp(2rem,8vw,3.2rem);margin:0;line-height:1.1}
#wrongfx p{font-size:clamp(1.1rem,4vw,1.5rem);margin:0;max-width:30ch}
#wrongfx .lv{font-size:2.4rem;letter-spacing:8px}
#wrongfx .btn{background:#fff;color:#8a3d00;box-shadow:0 6px 0 #c9661f;margin-top:8px}
#yesfx{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;pointer-events:none;font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,12vw,5rem);color:#fff;text-shadow:0 4px 0 #126b38,0 0 30px #2fa862}
#yesfx.show{display:flex;animation:yes 1.4s forwards}
@keyframes yes{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bob,#wrongfx svg,.lives .lost,#wrongfx.show{animation:none}.fcard,.bar i{transition:none}}
@media (max-width:420px){.visual{font-size:3.4rem}.q{font-size:1.35rem}.qrow svg{width:64px}.opt{font-size:1.15rem}}
</style></head><body>

/* whole-screen confetti on a fixed full-viewport canvas */
var confRAF=null;
function confetti(){
  var c=document.getElementById('conf'),g=c.getContext('2d');
  if(reduce){var y=document.getElementById('yesfx');y.classList.add('show');setTimeout(function(){y.classList.remove('show')},1400);return}
  var dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  var cols=['#ffcf2e','#e5483d','#3f8fd6','#2fa862','#ff7ac8','#9b6bff','#ffffff'],P=[],N=Math.min(260,Math.round(innerWidth/4));
  for(var i=0;i<N;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,w:8+Math.random()*8,h:10+Math.random()*10,vx:-1.5+Math.random()*3,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[i%cols.length]});
  var start=performance.now();cancelAnimationFrame(confRAF);
  document.getElementById('yesfx').classList.remove('show');void document.getElementById('yesfx').offsetWidth;document.getElementById('yesfx').classList.add('show');
  (function tick(now){
    g.clearRect(0,0,innerWidth,innerHeight);var alive=0;
    P.forEach(function(p){p.x+=p.vx+Math.sin(p.r)*1.2;p.y+=p.vy;p.r+=p.vr;if(p.y<innerHeight+30)alive++;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});
    if(alive&&now-start<5000)confRAF=requestAnimationFrame(tick);else{g.clearRect(0,0,innerWidth,innerHeight);document.getElementById('yesfx').classList.remove('show')}
  })(start);
}

function wrongScreen(o){
  var w=document.getElementById('wrongfx');
  w.innerHTML=bolt('sad')+'<h2 id="wh">'+o.title+'</h2><p>'+o.msg+'</p><div class="lv" aria-label="'+o.left+' lives left">'+hearts(o.left)+'</div><button class="btn" id="wgo">'+o.btn+'</button>';
  w.classList.add('show');wrongCb=o.done;
  function close(){w.classList.remove('show');document.removeEventListener('keydown',key);var f=wrongCb;wrongCb=null;if(f)f()}
  function key(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){e.preventDefault();close()}}
  w.onclick=close;document.addEventListener('keydown',key);
  document.getElementById('wgo').focus();
}
function hearts(n){var s='';for(var i=0;i<2;i++)s+=i<n?'❤️':'🤍';return s}

/* ---------- screens ---------- */
function home(){
  try{speechSynthesis.cancel()}catch(e){}
  app.className='card';
  app.innerHTML='<div class="hero">'+bolt('happy')+'<div><h1>Ashley\'s Automatic Scrubber</h1><p>Hi! I am Bolt. Let\'s learn the parts of Ashley\'s scrubber robot, then play the quiz!</p></div></div>'
   +'<div class="topics"><button class="topic" id="fc"><span class="big">📇</span><span><b>Learn with cards</b><span class="sub">'+FC.length+' flip cards</span></span></button>'
   +'<button class="topic mix" id="go"><span class="big">🧹</span><span><b>Start the quiz</b><span class="sub">'+Q.length+' questions · 2 lives each ❤️❤️</span></span>'+(best?'<span class="best" title="Best score">'+stars(best,3)+'</span>':'')+'</button></div>';
  document.getElementById('fc').onclick=function(){fi=0;flash()};
  document.getElementById('go').onclick=startQuiz;
}

function flash(){
  var c=FC[fi];app.className='card';
  app.innerHTML='<div class="meta"><button class="link" id="hm">← Home</button><span class="chip">Card '+(fi+1)+' of '+FC.length+'</span></div>'
   +'<div class="bar"><i style="width:'+((fi+1)/FC.length*100)+'%"></i></div>'
   +'<div class="stage" id="stage"><div class="fcard" id="fcard">'
   +'<div class="face front"><p class="q">'+esc(c.q)+'</p>'+(c.i?im(c.i):'')+'<p class="hint">Think, then tap the card 👆</p></div>'
   +'<div class="face back"><p class="ans">'+esc(c.a)+'</p>'+(c.n?'<p class="note">'+esc(c.n)+'</p>':'')+(c.i?im(c.i):'')+'</div></div></div>'
   +'<div class="fnav"><button id="pv">◀ Back</button><button class="mid" id="fl">🔄 Flip</button><button id="nx">Next ▶</button></div>'
   +'<div class="row"><button class="btn alt" id="toq" style="font-size:1.1rem;padding:10px 20px">✏️ Take the quiz</button></div>';
  var fc=document.getElementById('fcard');
  function flip(){fc.classList.toggle('flip')}
  document.getElementById('stage').onclick=flip;document.getElementById('fl').onclick=flip;
  document.getElementById('pv').onclick=function(){fi=(fi-1+FC.length)%FC.length;flash()};
  document.getElementById('nx').onclick=function(){fi=(fi+1)%FC.length;flash()};
  document.getElementById('hm').onclick=home;document.getElementById('toq').onclick=startQuiz;
}

function startQuiz(){run={i:0,first:0,got:0};beep(520,.1,'triangle');question()}

function question(){
  var it=Q[run.i],lives=2,done=false;
  var order=shuffle(it.o.map(function(_,i){return i}));
  var h='<div class="meta"><button class="link" id="quit">← Home</button><span class="chip">Question '+(run.i+1)+' of '+Q.length+'</span></div>'
   +'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+Q.length+'" aria-valuenow="'+run.i+'"><i style="width:'+(run.i/Q.length*100)+'%"></i></div>'
   +'<div class="qrow">'+bolt('happy')+'<h2 class="q">'+esc(it.q)+'</h2><button class="speak" id="spk" aria-label="Read the question out loud">🔊</button></div>'
   +'<div class="lives" id="lives" aria-label="2 lives left">'+hearts(2)+'</div>'
   +(it.i?'<div class="visual photo">'+im(it.i)+'</div>':it.v?'<div class="visual">'+it.v+'</div>':'')
   +'<div class="opts">';
  order.forEach(function(oi){var o=it.o[oi];
    h+='<button class="opt" data-i="'+oi+'">'+(o[1]?'<span class="em">'+im(o[1])+'</span>':'')+'<span>'+esc(o[0])+'</span></button>'});
  h+='</div><div class="fb" id="fb" aria-live="polite"></div><button class="btn" id="next" hidden>'+(run.i+1===Q.length?'See my stars ⭐':'Next →')+'</button>';
  app.innerHTML=h;
  var fb=document.getElementById('fb'),next=document.getElementById('next'),lv=document.getElementById('lives');
  var btns=[].slice.call(app.querySelectorAll('.opt'));
  function lock(){btns.forEach(function(x){x.disabled=true})}
  document.getElementById('quit').onclick=home;
  document.getElementById('spk').onclick=function(){speak(it.q+' '+it.o.map(function(o){return o[0]}).join(', or ')+'?')};
  btns.forEach(function(b){b.onclick=function(){
    if(done||b.disabled)return;
    var i=+b.dataset.i;
    if(i===it.a){
      done=true;b.classList.add('right');lock();
      run.got++;if(lives===2){run.first++;total++;totalEl.textContent=total;store(false,'ashleyScrubberTotal2',total)}
      sayYes();confetti();
      fb.className='fb good';fb.innerHTML='<span>🎉 Yes! <span class="why">'+esc(it.why)+'</span></span>';
      next.hidden=false;next.focus();
    }else{
      lives--;b.classList.add('wrong');b.disabled=true;
      lv.innerHTML=hearts(lives).replace(/🤍/g,'<span class="lost">🤍</span>');lv.setAttribute('aria-label',lives+' lives left');
      sayNo();
      if(lives>0){
        fb.className='fb bad';fb.textContent='Not quite – you still have 1 life. Try again! 💪';
        wrongScreen({title:'Almost there!',msg:'Every robot builder makes mistakes. You have 1 more try – you can do it!',left:lives,btn:'Try again 💪',done:function(){}});
      }else{
        done=true;lock();
        btns.forEach(function(x){if(+x.dataset.i===it.a)x.classList.add('right')});
        fb.className='fb bad';fb.innerHTML='<span>The answer is <b>'+esc(it.o[it.a][0])+'</b>. <span class="why">'+esc(it.why)+'</span></span>';
        wrongScreen({title:'Good try!',msg:'Now you know: <b>'+esc(it.o[it.a][0])+'</b>. Learning is how we get better!',left:0,btn:'Got it! ➜',done:function(){next.hidden=false;next.focus()}});
      }
    }
  }});
  next.onclick=function(){run.i++;run.i<Q.length?question():finish()};
  setTimeout(function(){speak(it.q)},250);
}

function finish(){
  var n=Q.length,s=run.first/n,st=s>=.85?3:s>=.55?2:1;
  if(st>best){best=st;store(false,'ashleyScrubberBest2',best)}
  var msg=st===3?'Super robot builder!':st===2?'Great job!':'Good try! Play again to get more stars.';
  app.className='card result';
  app.innerHTML=bolt('cheer')+'<h2>'+msg+'</h2><div class="big-stars" aria-label="'+st+' out of 3 stars">'+stars(st,3)+'</div>'
   +'<p>You got <b>'+run.first+'</b> of <b>'+n+'</b> right on the first try,<br>and <b>'+run.got+'</b> of <b>'+n+'</b> in total.</p>'
   +'<div class="row"><button class="btn" id="again">Play again 🔁</button><button class="btn alt" id="fcs">📇 Cards</button><button class="btn alt" id="hm">Home</button></div>';
  sayYes();beep(1040,.25,'triangle',.4);confetti();speak(msg);
  document.getElementById('again').onclick=function(){app.className='card';startQuiz()};
  document.getElementById('fcs').onclick=function(){app.className='card';fi=0;flash()};
  document.getElementById('hm').onclick=function(){app.className='card';home()};
}
window.addEventListener('resize',function(){});
home();
</script>
</body></html>
